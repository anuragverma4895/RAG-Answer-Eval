services:
  - type: web
    name: rag-answer-eval
    runtime: docker
    plan: standard
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: rag-answer-eval-data
      mountPath: /var/data
      sizeGB: 2
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: VECTOR_DB_PATH
        value: /var/data/chroma
      - key: SQLITE_PATH
        value: /var/data/rag_eval.db
      - key: HOME
        value: /var/data/home
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: OMP_NUM_THREADS
        value: "1"
